[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a11oy-factory"
version = "0.2.0"
description = "A11oy vertical factory — Decision Cell Compiler. BIND_AS_A11OY_PACKAGE. Not a second flagship."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "SZL Holdings", email = "stephenlutar2@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
a11oy-factory = "a11oy_factory.__main__:main"

[tool.setuptools.packages.find]
include = ["a11oy_factory*"]
