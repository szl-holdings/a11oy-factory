[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a11oy-factory"
version = "0.6.0"
description = "Governed AI distribution compiler: deterministic locks, policy gates, SPDX SBOMs, SLSA provenance, and fail-closed receipts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "SZL Holdings", email = "stephenlutar2@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
# The Python suites use only the standard library (unittest); the extra exists
# so `pip install -e '.[test]'` resolves without a missing-extra warning.
test = []

[project.scripts]
a11oy-factory = "a11oy_factory.__main__:main"

[project.urls]
Homepage = "https://github.com/szl-holdings/a11oy-factory"
Source = "https://github.com/szl-holdings/a11oy-factory"
Issues = "https://github.com/szl-holdings/a11oy-factory/issues"
Changelog = "https://github.com/szl-holdings/a11oy-factory/releases"

[tool.setuptools.packages.find]
include = ["a11oy_factory*"]

[tool.szl.release]
import_names = ["a11oy_factory"] # wheel top-level import names; the release gate fails if the built wheel differs
