name: Sync Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: a11oy-factory-hf-deploy
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
      HF_VERIFY_TIMEOUT: "900"
      HF_VERIFY_POLL: "8"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"

      - name: Publish factory Space
        run: python .github/scripts/publish_factory_space.py

      - name: Prove deployed runtime and public API contract
        run: python .github/scripts/verify_factory_space.py

      - name: Upload deployment proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11oy-factory-hf-deployment-proof
          path: dist/hf-deployment-verification.json
          if-no-files-found: error
          retention-days: 30
