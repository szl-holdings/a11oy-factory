name: Sync Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character Git commit on current main to publish
        required: true
        type: string

permissions:
  contents: read
  # Trusted Publisher (OIDC) exchange for spaces/SZLHOLDINGS/a11oy-factory.
  id-token: write

concurrency:
  group: hf-write/space/SZLHOLDINGS/a11oy-factory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: hugging-face-production
      url: https://huggingface.co/spaces/SZLHOLDINGS/a11oy-factory
    env:
      FACTORY_SOURCE_SHA: ${{ inputs.source_sha }}
      HF_VERIFY_TIMEOUT: "900"
      HF_VERIFY_POLL: "8"
    steps:
      - name: Validate requested source SHA shape
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be an exact lowercase 40-character Git SHA." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_sha }}

      - name: Prove exact source is current main
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$REQUESTED_SOURCE_SHA" ]]; then
            echo "Checkout mismatch: expected $REQUESTED_SOURCE_SHA, got $checked_out_sha." >&2
            exit 1
          fi

          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main_sha" != "$REQUESTED_SOURCE_SHA" ]]; then
            echo "Publication blocked: source_sha is not the current main commit." >&2
            echo "requested=$REQUESTED_SOURCE_SHA current_main=$current_main_sha" >&2
            exit 1
          fi

          {
            echo "## Authorized Hugging Face publication"
            echo
            echo "- Source SHA: \`$checked_out_sha\`"
            echo "- Authorization boundary: \`hugging-face-production\` environment"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned Hugging Face client
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==2.0.0"

      - name: Check out the immutable organization credential selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szl-holdings/.github
          ref: bedcd3c77b5cf745dcc1490ac503e30397633227
          path: .shared-github
          fetch-depth: 1
          persist-credentials: false

      - name: Acquire Space publisher credential (Trusted Publisher first)
        env:
          # The selector tries the OIDC exchange first. Its only fallback slot
          # carries the environment-scoped factory token; no repository-wide
          # Hugging Face secret is ever offered to this job.
          HF_TOKEN_CANDIDATE: ${{ secrets.HF_FACTORY_PRODUCTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          selector="${RUNNER_TEMP}/acquire_hf_publisher_token.py"
          cp .shared-github/.github/scripts/acquire_hf_publisher_token.py "$selector"
          # The publisher requires a clean upload workspace.
          rm -rf .shared-github
          python "$selector" \
            --target-repo SZLHOLDINGS/a11oy-factory \
            --target-type space \
            --oidc-resource spaces/SZLHOLDINGS/a11oy-factory \
            --token-file "${RUNNER_TEMP}/factory-hf-token" \
            --report "${RUNNER_TEMP}/hf-publisher-credential.json"

      - name: Publish factory Space
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          token_file="${RUNNER_TEMP}/factory-hf-token"
          test -s "$token_file"
          HF_TOKEN="$(tr -d '\r\n' < "$token_file")" \
            python .github/scripts/publish_factory_space.py

      - name: Prove deployed runtime and public API contract
        env:
          FACTORY_PROVIDER_SHA: ${{ steps.publish.outputs.uploaded_revision }}
        shell: bash
        run: |
          set -euo pipefail
          token_file="${RUNNER_TEMP}/factory-hf-token"
          test -s "$token_file"
          HF_TOKEN="$(tr -d '\r\n' < "$token_file")" \
            python .github/scripts/verify_factory_space.py

      - name: Remove the ephemeral publisher credential
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/factory-hf-token"

      - name: Upload deployment proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11oy-factory-hf-deployment-proof
          path: |
            dist/hf-deployment-verification.json
            ${{ runner.temp }}/hf-publisher-credential.json
          if-no-files-found: error
          retention-days: 30
