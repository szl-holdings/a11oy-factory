name: Sync Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN is not set. Space stays PREPARED_NOT_LIVE. No Hub mutation."
            exit 0
          fi
          git config user.name "szl-factory"
          git config user.email "factory@szl-holdings"
          git remote add hf "https://huggingface.co/spaces/SZLHOLDINGS/a11oy-factory" || true
          git push "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/SZLHOLDINGS/a11oy-factory" HEAD:main --force
