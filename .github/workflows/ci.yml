name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run clean-clone test contract
        run: npm test
      - name: Verify auth invariant against a live dev server
        shell: bash
        env:
          VITE_AUTH_ENABLED: "false"
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/a11oy-factory-dev.log"
          npm run dev >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 180); do
            if curl --fail --silent \
              http://127.0.0.1:8080/__app-env >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "The local dev server exited before becoming ready."
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            echo "The local dev server did not become ready within 180 seconds."
            cat "$log_file"
            exit 1
          fi

          npm run check:auth -- --dev-url http://127.0.0.1:8080
      - name: Typecheck
        run: npm run typecheck
      - name: Build production application
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test provider publisher fail-closed contract
        run: python .github/scripts/test_publish_factory_space.py -v
      - name: Test Factory Python contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
