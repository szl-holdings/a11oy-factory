# Decision Cell Compiler unit tests. BIND_AS_A11OY_PACKAGE.
name: compiler
on:
  push:
    branches: [main]
    paths:
      - "a11oy_factory/**"
      - "tests/test_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/compiler.yml"
  pull_request:
    paths:
      - "a11oy_factory/**"
      - "tests/test_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/compiler.yml"
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Decision Cell Compiler
        run: python3 -m unittest discover -s tests -v
